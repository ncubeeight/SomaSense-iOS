# Generate the Xcode project with `xcodegen generate` from this folder.
name: SomaSense
options:
  bundleIdPrefix: com.ncubeeight
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 9Q3FCK2997
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SomaSense:
    type: application
    platform: iOS
    sources:
      - path: SomaSense
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ncubeeight.somasense
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SomaSense
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  SomaSenseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SomaSenseTests
    dependencies:
      - target: SomaSense
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.ncubeeight.somasense.tests
schemes:
  SomaSense:
    build:
      targets:
        SomaSense: all
        SomaSenseTests: [test]
    test:
      targets:
        - SomaSenseTests
